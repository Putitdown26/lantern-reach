<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lantern Reach</title>
<meta name="description" content="Lantern Reach: a space trading, smuggling and heist adventure in a dark, dangerous corner of space.">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern Reach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --c:#9fe8ff; --gold:#ffd25a; --bg:#070b12; --pan:#0c1320; --line:#23405a; --txt:#dfe8ee; --dim:#8fa3b5; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:#000; color:var(--txt); font-family:'Exo 2', system-ui, sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
#cv{ position:fixed; inset:0; display:block; }
#grain{ position:fixed; inset:-160px; pointer-events:none; z-index:3; display:none; opacity:.9; animation:grain .28s steps(4) infinite; }
body.noir #grain{ display:block; }
@keyframes grain{ 0%{transform:translate(0,0)} 25%{transform:translate(-53px,37px)} 50%{transform:translate(71px,-29px)} 75%{transform:translate(-19px,-83px)} 100%{transform:translate(0,0)} }
button{ font-family:inherit; font-size:14px; color:var(--txt); background:#13202f; border:1px solid var(--line); border-radius:8px; padding:9px 12px; cursor:pointer; }
button:disabled{ opacity:.38; cursor:default; }
button.b{ background:#123a4c; border-color:#2f7fa0; color:#dff7ff; }
button.big{ padding:13px 18px; font-size:16px; font-weight:600; min-width:150px; }
button.sm{ padding:6px 9px; font-size:12.5px; }
#topbar{ position:fixed; left:0; right:0; top:0; height:46px; padding:6px 8px; padding-top:max(6px, env(safe-area-inset-top)); display:none; align-items:center; gap:6px; background:linear-gradient(#0b1422ee,#0b142299); border-bottom:1px solid var(--line); z-index:5; }
#topbar .loc{ flex:1; font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#topbar .cr{ color:var(--gold); font-weight:600; font-size:14px; margin-right:4px; white-space:nowrap; }
#topbar button{ padding:7px 10px; font-size:13px; }
#spaceui{ display:none; position:fixed; inset:0; pointer-events:none; z-index:4; }
#spaceui .hb{ pointer-events:auto; position:absolute; background:rgba(10,30,45,0.55); border:1px solid rgba(120,220,255,0.45); color:#cff4ff; border-radius:12px; font-weight:600; letter-spacing:.5px; touch-action:none; }
#spaceui .hb.down{ background:rgba(60,160,200,0.6); }
.tr{ top:max(8px, env(safe-area-inset-top)); right:max(8px, env(safe-area-inset-right)); position:absolute; display:flex; flex-direction:column; gap:6px; pointer-events:auto; }
#spaceui .tr .hb{ position:static; padding:7px 8px; font-size:12px; min-width:54px; }
@media (orientation:landscape){ .tr{ flex-direction:row; } }
#bFire{ right:max(16px, env(safe-area-inset-right)); bottom:max(22px, env(safe-area-inset-bottom)); width:92px; height:92px; border-radius:50% !important; font-size:16px; background:rgba(120,30,30,0.5) !important; border-color:rgba(255,120,120,0.7) !important; }
#bFire.down{ background:rgba(220,60,60,0.7) !important; }
#bMsl{ right:max(16px, env(safe-area-inset-right)); bottom:calc(max(22px, env(safe-area-inset-bottom)) + 102px); width:92px; height:40px; font-size:12px; }
#bBoost{ right:max(16px, env(safe-area-inset-right)); bottom:calc(max(22px, env(safe-area-inset-bottom)) + 150px); width:92px; height:40px; font-size:12px; background:rgba(90,70,10,0.5) !important; border-color:rgba(255,220,100,0.7) !important; }
#bUp,#bDn{ right:calc(max(16px, env(safe-area-inset-right)) + 102px); width:56px; height:46px; font-size:18px; }
#bDn{ bottom:max(22px, env(safe-area-inset-bottom)); } #bUp{ bottom:calc(max(22px, env(safe-area-inset-bottom)) + 54px); }
#bRl,#bRr{ bottom:max(22px, env(safe-area-inset-bottom)); width:50px; height:42px; font-size:18px; }
#bRl{ left:max(12px, env(safe-area-inset-left)); } #bRr{ left:calc(max(12px, env(safe-area-inset-left)) + 58px); }
#bCtx{ left:50%; transform:translateX(-50%); bottom:max(22px, env(safe-area-inset-bottom)); min-width:110px; height:46px; font-size:14px; }
#bCtx.hot{ background:rgba(140,110,20,0.7); border-color:var(--gold); color:#fff6d0; animation:pulse 1s infinite; }
#bCtx.on{ border-color:var(--gold); color:var(--gold); }
@keyframes pulse{ 50%{ box-shadow:0 0 18px rgba(255,210,90,0.8); } }
#toasts{ position:fixed; top:max(54px, calc(env(safe-area-inset-top) + 48px)); left:50%; transform:translateX(-50%); width:min(92vw,520px); display:flex; flex-direction:column; gap:6px; z-index:30; pointer-events:none; }
.toast{ pointer-events:auto; cursor:pointer; background:rgba(10,20,32,0.92); border:1px solid var(--line); border-left:4px solid var(--c); padding:6px 10px; border-radius:8px; font-size:13px; transition:opacity .6s; }
.toast.good{ border-left-color:#5dff8f; } .toast.bad{ border-left-color:#ff5a4e; } .toast.story{ border-left-color:var(--gold); color:#fff1c4; }
.toast.fade{ opacity:0; }
.toast.tip{ border-left-color:#ffd84a; background:rgba(28,30,10,0.95); }
body.comic .toast.tip{ background:#ffe14a; color:#000; border:3px solid #000; border-radius:0; box-shadow:4px 4px 0 #000; font-family:'Bangers','Arial Black',Impact,sans-serif; font-weight:400; font-size:16px; letter-spacing:.6px; text-transform:uppercase; }
#overlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); z-index:20; padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)); }
#overlay.show{ display:flex; }
.panel{ width:min(560px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--pan); border:1px solid #2a4c6a; border-radius:14px; box-shadow:0 10px 40px #000a; overflow:hidden; }
.panel.wide{ width:min(620px,100%); }
.phead{ display:flex; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); background:#0f1a2a; }
.phead span{ flex:1; font-weight:800; letter-spacing:.5px; font-size:15px; color:var(--c); }
.phead button{ padding:4px 10px; }
#pbody{ padding:12px; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; user-select:text; -webkit-user-select:text; }
.txt p{ margin:0 0 10px; line-height:1.5; font-size:15px; }
.dlg-head{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.portrait{ width:68px; height:68px; border-radius:14px; display:block; box-shadow:inset 0 -8px 0 rgba(0,0,0,0.3), 0 0 0 2px #0008, 0 0 0 3px #ffffff22; flex:none; }
.dlg-name{ font-weight:800; font-size:16px; } .dlg-role{ color:var(--dim); font-size:12.5px; }
.opts{ display:flex; flex-direction:column; gap:7px; margin-top:6px; }
.opt{ text-align:left; background:#122336; border-color:#2b5576; font-size:14.5px; line-height:1.35; }
.opt:hover{ background:#173048; }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; font-size:14px; }
.between{ justify-content:space-between; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button{ border:0; border-radius:0; padding:6px 10px; font-size:12.5px; background:#101b29; }
.seg button.on{ background:#1d5470; color:#fff; }
.tabs{ display:flex; width:100%; margin-bottom:10px; overflow-x:auto; } .tabs button{ flex:1; white-space:nowrap; }
.mkt{ display:flex; flex-direction:column; gap:2px; }
.mrow{ display:grid; grid-template-columns: 1fr 52px 52px 34px 108px; align-items:center; gap:4px; padding:5px 4px; border-bottom:1px solid #16273a; font-size:13.5px; }
.mrow.mh{ color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; }
.mrow i{ color:#ff7a6a; font-style:normal; font-size:10.5px; }
.mrow.rare span:first-child{ color:#7ff0d8; }
.mrow .up{ color:#5dff8f; } .mrow .down{ color:#ff8a7a; }
.mrow .btns{ display:flex; gap:4px; justify-content:flex-end; }
.item{ background:#0f1a28; border:1px solid #1b3249; border-radius:10px; padding:9px 10px; margin-bottom:7px; font-size:14px; }
.item.cur{ border-color:#2f7fa0; }
.sub{ color:var(--dim); font-size:12.5px; margin-top:3px; line-height:1.4; }
.sub.warn, .warn{ color:#ff9a7a; } .sub.good{ color:#5dff8f; } .gold{ color:var(--gold)!important; }
.btnrow{ display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.reward{ color:var(--gold); font-weight:600; margin-right:auto; }
.note{ color:var(--dim); font-size:12.5px; margin:8px 2px; line-height:1.45; }
h3{ margin:14px 0 6px; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--c); }
.lv{ color:var(--gold); font-size:12px; }
.xpbar{ height:8px; background:#06101a; border-radius:4px; margin-top:6px; overflow:hidden; } .xpbar div{ height:100%; background:linear-gradient(90deg,#3fd0ff,#5dff8f); }
.repbar{ position:relative; height:8px; background:#06101a; border-radius:4px; margin-top:6px; overflow:hidden; } .repbar div{ position:absolute; top:0; bottom:0; }
.repbar::after{ content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; background:#fff5; }
.pips{ color:var(--gold); letter-spacing:2px; }
.jent{ font-size:13px; padding:5px 2px; border-bottom:1px solid #16273a; line-height:1.4; } .day{ color:var(--gold); font-size:11.5px; }
.item.obj{ border-color:#806a2a; }
canvas.map{ display:block; margin:0 auto 8px; border-radius:10px; border:1px solid var(--line); touch-action:none; }
.mapinfo{ min-height:70px; font-size:14px; }
.dice{ text-align:center; padding:10px; border-radius:10px; margin:8px 0; background:#0f1a28; font-size:15px; } .dice .big{ font-size:20px; font-weight:800; margin-top:6px; }
.dice.win{ border:1px solid #5dff8f; } .dice.lose{ border:1px solid #ff5a4e; }
button.menu{ display:block; width:100%; margin-bottom:8px; padding:12px; font-size:15px; }
textarea.code{ width:100%; height:120px; background:#06101a; color:#cfe; border:1px solid var(--line); border-radius:8px; font-size:11px; font-family:ui-monospace,monospace; }
#title{ position:fixed; inset:0; display:none; align-items:center; justify-content:flex-start; padding:20px max(20px,env(safe-area-inset-left)); z-index:10; }
.tbox{ display:flex; flex-direction:column; gap:10px; max-width:320px; width:100%; background:rgba(5,10,18,0.55); padding:22px; border-radius:16px; border:1px solid #1d3550; backdrop-filter:blur(3px); }
.logo{ font-weight:800; font-size:44px; line-height:.95; letter-spacing:4px; color:#ffe2a0; text-shadow:0 0 24px rgba(255,190,90,0.55); }
.logo.sm{ font-size:28px; }
.tag{ color:var(--dim); margin-bottom:8px; font-size:14px; }
.small{ color:#6d8296; font-size:12px; margin-top:6px; }
.tbox label{ display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--dim); }
.tbox input{ font-family:inherit; font-size:16px; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0a1420; color:#fff; user-select:text; -webkit-user-select:text; }
#flash{ position:fixed; inset:0; background:radial-gradient(circle, #fff 0%, #bff 40%, rgba(120,220,255,0) 80%); opacity:0; pointer-events:none; z-index:25; transition:opacity .8s ease-in; }
#flash.on{ opacity:1; }
#arrival{ position:fixed; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(0,0,0,0.88); animation:arrIn .35s ease-out; }
#arrival canvas{ box-shadow:0 10px 40px #000; animation:arrZoom 8s ease-out forwards; }
#arrival .tap{ color:#cbd5df; font-size:13px; letter-spacing:1px; opacity:.8; }
#arrival.out{ opacity:0; transition:opacity .3s; }
@keyframes arrIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes arrZoom{ from{ transform:scale(1.04); } to{ transform:scale(1); } }
#flash.black{ background:#000; transition:opacity 1.2s ease-in; }
input.rename{ font-family:inherit; font-size:14px; padding:7px; border-radius:8px; border:1px solid var(--line); background:#0a1420; color:#fff; width:150px; user-select:text; -webkit-user-select:text; }
.panel.ending .phead span{ color:var(--gold); }
#overlay.light{ background:rgba(0,0,0,0.12); }
.panel.heist{ max-height:62%; border-color:#806a2a; }
.panel.heist .opts{ display:grid; grid-template-columns:1fr 1fr; gap:6px; } .panel.heist .opt{ font-size:14px; padding:8px 10px; }
.panel.heist .heistbar, .panel.heist .watch{ position:sticky; top:-12px; background:var(--pan); z-index:2; padding-top:4px; }
.panel.heist .watch{ top:14px; }
@media (orientation:landscape){ #overlay.light{ align-items:stretch !important; } .panel.heist{ max-height:100%; width:min(470px,56%); } }
#toasts.bottom{ top:auto; bottom:max(12px, env(safe-area-inset-bottom)); }
.panel.heist .txt p{ font-size:16px; font-weight:600; }
.heistbar{ display:flex; align-items:center; gap:8px; margin-bottom:6px; } .heistbar .hm{ flex:1; height:12px; background:#06101a; border-radius:6px; overflow:hidden; border:1px solid #23405a; } .heistbar .hm div{ height:100%; width:0; background:#5dff8f; transition:width .2s; }
.watch{ font-size:13px; font-weight:600; margin-bottom:8px; } .watch.bad{ color:#ff7a6a; } .watch.ok{ color:#5dff8f; }

/* ---------- comic art style ---------- */
body.comic .panel{ border:3px solid #000; box-shadow:6px 6px 0 #000; background:#121a28; }
body.comic .phead{ background:#f6e27a; border-bottom:3px solid #000; }
body.comic .phead span{ color:#111; font-family:'Bangers','Arial Black',Impact,sans-serif; font-weight:400; font-size:22px; letter-spacing:1.2px; }
body.comic .phead button{ background:#fff; color:#000; border:2px solid #000; }
body.comic .panel.dialog .txt{ background:#fffdf3; color:#111; border:2.5px solid #000; border-radius:18px; padding:10px 13px 2px; position:relative; margin:4px 0 12px; }
body.comic .panel.dialog .txt::after{ content:''; position:absolute; left:26px; top:-13px; border:10px solid transparent; border-bottom:12px solid #000; }
body.comic .panel.dialog .txt::before{ content:''; position:absolute; left:28px; top:-8px; border:8px solid transparent; border-bottom:9px solid #fffdf3; z-index:1; }
body.comic .dlg-name{ font-family:'Bangers','Arial Black',Impact,sans-serif; font-weight:400; font-size:23px; letter-spacing:1px; }
body.comic .portrait{ border:3px solid #000; box-shadow:3px 3px 0 #000; border-radius:6px; }
.lookwrap{ display:flex; justify-content:center; margin:4px 0 10px; }
.lookprev{ width:240px; height:180px; border-radius:12px; border:1px solid #ffffff22; }
body.comic .lookprev{ border:3px solid #000; box-shadow:4px 4px 0 #000; border-radius:4px; }
.lookrow{ margin:8px 0; } .lookrow .lk{ font-size:12px; color:var(--dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:.06em; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; } .chips .chip{ padding:5px 9px; font-size:12.5px; border-radius:14px; background:#ffffff12; border:1px solid #ffffff22; color:inherit; }
.chips .chip.on{ background:var(--acc,#2fc4ff); color:#001018; border-color:transparent; font-weight:700; }
.swatches{ display:flex; flex-wrap:wrap; gap:7px; } .swatches .sw{ width:28px; height:28px; border-radius:50%; border:2px solid #0009; padding:0; }
.swatches .sw.on{ outline:3px solid #fff; outline-offset:1px; }
body.comic .chips .chip{ border:2px solid #000; background:#fff; color:#000; border-radius:4px; } body.comic .chips .chip.on{ background:#ffd84a; color:#000; }
body.comic .swatches .sw{ border:2px solid #000; } body.comic .swatches .sw.on{ outline:3px solid #000; box-shadow:0 0 0 5px #ffd84a; }
body.comic .opt{ background:#fffdf3; color:#111; border:2px solid #000; box-shadow:3px 3px 0 #000; font-weight:600; }
body.comic .opt:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
body.comic button.b{ background:#ffd23f; color:#111; border:2px solid #000; box-shadow:3px 3px 0 #000; font-weight:700; }
body.comic button.b:disabled{ box-shadow:none; }
body.comic .item{ border:2px solid #000; box-shadow:3px 3px 0 rgba(0,0,0,0.85); background:#172235; }
body.comic h3{ font-family:'Bangers','Arial Black',Impact,sans-serif; font-weight:400; font-size:18px; letter-spacing:1.2px; color:#ffd23f; }
body.comic .toast{ background:#f6e27a; color:#111; border:2px solid #000; border-left:8px solid #000; box-shadow:3px 3px 0 #000; font-weight:600; }
body.comic .toast.good{ border-left-color:#1a8a3a; } body.comic .toast.bad{ border-left-color:#c0201a; } body.comic .toast.story{ background:#fff3b0; color:#111; border-left-color:#d06a00; }
body.comic #topbar{ background:#f6e27a; border-bottom:3px solid #000; }
body.comic #topbar .loc{ color:#111; font-family:'Bangers','Arial Black',Impact,sans-serif; font-weight:400; font-size:21px; letter-spacing:1px; }
body.comic #topbar .cr{ color:#7a1600; }
body.comic #topbar button{ background:#fff; color:#111; border:2px solid #000; box-shadow:2px 2px 0 #000; }
body.comic #spaceui .hb{ border:2px solid #000; box-shadow:2px 2px 0 #000; background:rgba(255,253,243,0.88); color:#111; }
body.comic #spaceui .hb.down{ background:#ffd23f; }
body.comic #bFire{ background:rgba(220,40,30,0.85) !important; color:#fff; border:3px solid #000 !important; }
body.comic #bBoost{ background:rgba(255,210,63,0.9) !important; border-color:#000 !important; color:#111; }
body.comic #bCtx.hot{ background:#ffd23f; color:#111; border-color:#000; }
body.comic .logo{ font-family:'Bangers','Arial Black',Impact,sans-serif; font-weight:400; letter-spacing:4px; color:#ffd23f; -webkit-text-stroke:2px #000; text-shadow:4px 4px 0 #000; }
body.comic .tbox{ border:3px solid #000; box-shadow:6px 6px 0 #000; background:rgba(18,26,40,0.9); }
body.comic .seg{ border:2px solid #000; } body.comic .seg button.on{ background:#ffd23f; color:#111; }
/* ---- noir mood: near-black panels, off-white type, one amber/red accent ---- */
body.noir .panel{ background:#0c0d10; border:2px solid #000; box-shadow:0 0 0 1px #2a2c30, 8px 8px 0 rgba(0,0,0,0.8); }
body.noir .phead{ background:#121317; border-bottom:2px solid #c9a227; }
body.noir .phead span{ color:#e8e2d6; }
body.noir .phead button{ background:#1b1c21; color:#e8e2d6; border:1px solid #444; }
body.noir .panel.dialog .txt{ background:#16171b; color:#e8e2d6; border:2px solid #000; box-shadow:0 0 0 1px #33353b; }
body.noir .panel.dialog .txt::before{ border-bottom-color:#16171b; }
body.noir .opt{ background:#18191e; color:#e8e2d6; border:1px solid #3a3c42; box-shadow:3px 3px 0 #000; }
body.noir button.b{ background:#d4a82a; color:#14120a; border:2px solid #000; }
body.noir .item{ background:#121318; border:1px solid #2b2d33; box-shadow:3px 3px 0 #000; }
body.noir h3{ color:#d9902e; }
body.noir .toast, body.noir .toast.story{ background:#0c0d10; color:#e8e2d6; border:2px solid #000; border-left:6px solid #c9a227; box-shadow:0 0 0 1px #33353b; }
body.noir .toast.tip{ background:#000; color:#f2ece0; border:2px solid #e8e2d6; box-shadow:4px 4px 0 #c9a227; }
body.noir #topbar{ background:#0c0d10; border-bottom:2px solid #c9a227; }
body.noir #topbar .loc{ color:#e8e2d6; } body.noir #topbar .cr{ color:#d9902e; }
body.noir #topbar button{ background:#18191e; color:#e8e2d6; border:1px solid #444; box-shadow:2px 2px 0 #000; }
body.noir #spaceui .hb{ background:rgba(16,17,21,0.85); color:#e8e2d6; border:1px solid #444; }
body.noir #spaceui .hb.down{ background:#d4a82a; color:#14120a; }
body.noir .seg button.on{ background:#d4a82a; color:#14120a; }
body.noir .chips .chip{ background:#18191e; color:#e8e2d6; border-color:#444; } body.noir .chips .chip.on{ background:#d4a82a; color:#14120a; }
body.noir .logo{ color:#c9c2b4; -webkit-text-stroke:2px #000; text-shadow:4px 4px 0 #c9a227; }
body.noir .tbox{ background:rgba(10,11,14,0.94); }

function drawPortrait(cv, L, bg){
  const dpr = Math.min(2, window.devicePixelRatio || 1), S = cv.clientWidth || 72;
  cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const CM = comicOn();
  const NR = typeof noirOn === 'function' && noirOn();
  const b = NR ? shade(hexRGB(bg || '#3a4a6a'), 0.45) : hexRGB(bg || '#3a4a6a');
  const g = ctx.createRadialGradient(S * 0.4, S * 0.3, 2, S / 2, S / 2, S * 0.75); g.addColorStop(0, rgbs(shade(b, 1.35))); g.addColorStop(1, rgbs(shade(b, 0.45)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  if (NR){ const lg = ctx.createLinearGradient(0, 0, S, 0); lg.addColorStop(0, 'rgba(255,170,90,0.28)'); lg.addColorStop(0.6, 'rgba(0,0,0,0)'); ctx.fillStyle = lg; ctx.fillRect(0, 0, S, S); }
  else if (CM){ ctx.fillStyle = dotPattern(ctx, 'rgba(0,0,0,0.22)', 5, 1.3); ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2; for (let i = 0; i < 14; i++){ const a = i / 14 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(S / 2 + Math.cos(a) * S * 0.36, S * 0.42 + Math.sin(a) * S * 0.36); ctx.lineTo(S / 2 + Math.cos(a) * S, S * 0.42 + Math.sin(a) * S); ctx.stroke(); } }
  const s = NR ? S * 2.45 : S * 1.9;
  drawFigure(ctx, S / 2, NR ? S * 2.27 : S * 1.74, s / (L.tall || 1), L, {t: performance.now() / 1000, ink: CM, portrait: 1, fdx: 0.6, fdy: 1});
  if (NR){ const sg = ctx.createLinearGradient(0, 0, S, 0); sg.addColorStop(0.45, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,0.55)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, S, S); }
}
function portraitEl(L, bg){
  const cv = document.createElement('canvas'); cv.className = 'portrait pcv';
  requestAnimationFrame(() => drawPortrait(cv, L, bg));
  return cv;
}

const rnd = (a=1,b) => b===undefined ? Math.random()*a : a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a, b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => v<a?a:v>b?b:v;

// ---------- ship stats ----------
function shipStats(g=G){
  const h = HULLS[g.hull], u = g.upg, sk = g.skills;
  const lv = (k) => u[k] ? UPG[k].lv[u[k]-1].v : 0;
  return {
    hull: Math.round(h.hull*(1+lv('armor'))),
    sh: Math.round(h.sh*(1+lv('shield'))),
    cargo: Math.round(h.cargo*(1+lv('cargo'))),
    spd: h.spd*(1+lv('engine'))*(1+sk.piloting*0.06),
    turn: h.turn*(1+lv('engine')*0.8)*(1+sk.piloting*0.06),
    ws: h.ws, rack: lv('rack'), boost: !!u.boost, nanite: !!u.nanite, hold: u.hold||0, holdCap: (u.hold||0)*4,
    regen: (6 + h.sh*0.06)*(1+sk.engineering*0.2),
    dmgMul: 1+sk.gunnery*0.1
  };
}
function illegalUnits(g=G){
  let n = 0; for (const k in g.cargo) if (CID[k] && (CID[k].ill||CID[k].hot)) n += g.cargo[k];
  for (const k in g.mcargo) if (CID[g.mcargo[k].cid] && CID[g.mcargo[k].cid].ill) n += g.mcargo[k].qty;
  return n;
}
function hiddenUsed(g=G){ return Math.min(illegalUnits(g), (g.upg.hold||0)*4); }
function cargoUsed(g=G){
  let n = 0; for (const k in g.cargo) n += g.cargo[k];
  for (const k in g.mcargo) n += g.mcargo[k].qty;
  return n - hiddenUsed(g);
}
function scanFindChance(){ return Math.max(0, 1 - 0.25*(G.upg.hold||0)) * (G.flags && G.flags.intelScan===G.day ? 0.5 : 1); }
function cargoFree(cid){ const base = shipStats().cargo - cargoUsed(); if (cid && CID[cid] && (CID[cid].ill||CID[cid].hot)) return base + Math.max(0, (G.upg.hold||0)*4 - illegalUnits()); return base; }
function have(cid){ return G.cargo[cid]||0; }
function give(cid, n){ G.cargo[cid] = (G.cargo[cid]||0)+n; if (G.cargo[cid]<=0) delete G.cargo[cid]; }
function hasContraband(){
  for (const k in G.cargo) if (CID[k] && (CID[k].ill||CID[k].hot) && G.cargo[k]>0) return true;
  for (const k in G.mcargo) if (CID[G.mcargo[k].cid] && CID[G.mcargo[k].cid].ill) return true;
  return false;
}
function addCredits(n, why){
  G.credits = Math.max(0, Math.round(G.credits + n));
  if (why) toast((n>=0?'+':'')+fmt(n)+' cr — '+why, n>=0?'good':'bad');
}
function rep(fac, d, quiet){
  const old = G.rep[fac];
  G.rep[fac] = clamp(Math.round(old + d), -100, 100);
  if (!quiet && d) toast(FACTIONS[fac].n+' '+(d>0?'+':'')+Math.round(d), d>0?'good':'bad');
}
function repLabel(v){
  return v>=60?'Revered':v>=30?'Friendly':v>=10?'Liked':v>-10?'Neutral':v>-30?'Disliked':v>-60?'Hostile':'Hated';
}
function xpNeeded(lv){ return Math.round(80*Math.pow(lv,1.55)); }
function addXP(n){
  G.xp += n;
  while (G.xp >= xpNeeded(G.level)){
    G.xp -= xpNeeded(G.level); G.level++; G.points++;
    toast('Pilot rank '+G.level+'! Skill point gained (open Pilot to spend).','good');
    sfx('level');
  }
}
function journal(t){ G.journal.unshift({d:G.day, t}); if (G.journal.length>60) G.journal.pop(); }
function setStage(s){
  G.stage = s;
  const o = objective();
  journal('Objective: '+o);
  toast('Objective: '+o,'story');
}
function flag(k, v){ if (v===undefined) return G.flags[k]; G.flags[k]=v; }

// ---------- economy ----------
function sysDrift(sys, cid){ return (G.drift[sys] && G.drift[sys][cid]) || 1; }
function setDrift(sys, cid, v){ G.drift[sys] = G.drift[sys]||{}; G.drift[sys][cid] = clamp(v, .6, 1.6); }
function basePrice(sys, cid){
  const S = SYSTEMS[sys], c = CID[cid];
  let m = (ECON[S.econ][cid] || 1) * ((S.over && S.over[cid]) || 1);
  if (c.ill && S.bm && S.econ!=='haven') m *= 1.35;
  return c.p * m * sysDrift(sys, cid);
}
function canBuy(sys, cid){
  const S = SYSTEMS[sys], c = CID[cid];
  if (S.econ==='none' || c.hot) return false;
  if (c.rare) return S.econ==='haven';
  if (c.ill) return S.econ==='haven';
  return true;
}
function canSell(sys, cid){
  const S = SYSTEMS[sys], c = CID[cid];
  if (S.econ==='none' || c.hot) return false;
  if (c.rare) return S.econ==='haven' || sys==='ostra';
  if (c.ill) return !!S.bm;
  return true;
}
function buyPrice(sys,cid){ const d = sys===G.loc && typeof dealPct==='function' ? dealPct('K') : 0; return Math.max(1, Math.round(basePrice(sys,cid)*1.05*(1-G.skills.trade*0.02)*(1-d))); }
function sellPrice(sys,cid){ const d = sys===G.loc && typeof dealPct==='function' ? dealPct('K') : 0; return Math.max(1, Math.round(basePrice(sys,cid)*0.95*(1+G.skills.trade*0.02)*(1+d*0.5))); }
function driftAll(){
  if (G && G.rep && G.rep.talon < 0) G.rep.talon = Math.min(0, G.rep.talon + 2);   // grudges fade: the Talon have short memories, and long lists
  for (const s in SYSTEMS) for (const c of COMMODS){
    const v = sysDrift(s, c.id);
    setDrift(s, c.id, v + rnd(-0.07,0.07) + (1-v)*0.2);
  }
}
function trade(cid, n){ // n>0 buy, n<0 sell
  const sys = G.loc;
  if (n>0){
    const p = buyPrice(sys,cid);
    if (G.credits < p) return toast('Not enough credits','bad');
    if (cargoFree(cid)<1) return toast('Hold is full','bad');
    G.credits -= p; give(cid,1); setDrift(sys,cid,sysDrift(sys,cid)+0.008);
    G.stats.trades++; G.cost = G.cost||{}; G.cost[cid] = p;
  } else {
    if (have(cid)<1) return;
    const p = sellPrice(sys,cid);
    G.credits += p; give(cid,-1); setDrift(sys,cid,sysDrift(sys,cid)-0.008);
    G.stats.trades++;
    if (G.cost && G.cost[cid]) { G.stats.profit += p - G.cost[cid]; if (p>G.cost[cid]*1.15 && Math.random()<0.25) addXP(1); }
  }
  sfx('click');
}

// ---------- docking / map ----------
function linksOf(sys){
  return SYSTEMS[sys].links.filter(l => !(SYSTEMS[l].locked && !G.flags.laneOpen));
}
function hops(a, b){
  const seen = {[a]:0}, q=[a];
  while (q.length){ const s=q.shift(); if (s===b) return seen[s];
    for (const l of linksOf(s)) if (seen[l]===undefined){ seen[l]=seen[s]+1; q.push(l); } }
  return 99;
}
function canDock(sys){
  const S = SYSTEMS[sys];
  if (!S.st) return {ok:false, why:'There is no station here.'};
  if (S.derelict) return {ok:true};
  if (G.stage==='end_keep' && sys==='vesk') return {ok:true};
  if (G.banned && G.banned[sys]!=null && G.day - G.banned[sys] < 15) return {ok:false, why:'You are banned from '+S.st+' for another '+(15-(G.day-G.banned[sys]))+' day(s).'};
  const r = G.rep[S.fac];
  const lim = S.fac==='talon' ? -25 : S.fac==='concord' ? -30 : -45;
  if (r < lim) return {ok:false, why:S.st+' refuses docking clearance. ('+FACTIONS[S.fac].n+' standing too low)'};
  return {ok:true};
}
function isWanted(){ return G.rep.concord <= -30; }

// ---------- missions ----------
const MNAMES = ['Varn','Kessel','Orla','Brask','Tibo','Sorrel','Grieve','Malko','Wex','Rhona','Coyle','Imre'];
function reachable(sys, maxH){
  const out=[]; for (const s in SYSTEMS){ const S=SYSTEMS[s]; if (s===sys||S.locked||S.derelict) continue;
    const h=hops(sys,s); if (h<=maxH) out.push([s,h]); } return out;
}
function genBoard(sys){
  const S = SYSTEMS[sys], list=[];
  if (S.econ==='none') return list;
  const dests = reachable(sys, 3);
  const n = rint(3,5);
  for (let i=0;i<n;i++){
    let types = ['deliver','deliver','courier','bounty','clear'];
    if (S.fac==='concord') types.push('bounty','clear');
    if (S.bm) types.push('smuggle','smuggle');
    if (sys==='vesk' && G.rep.talon>=10) types.push('raid');
    if (sys==='ostra') types.push('fetch','fetch');
    const t = pick(types), id = 'm'+(G.mid++);
    const [d,h] = pick(dests) || ['haldane',1];
    if (t==='deliver'){
      const goods = COMMODS.filter(c=>!c.ill&&!c.rare&&!c.hot);
      const c = pick(goods), q = rint(3, Math.min(20, Math.max(4, Math.round(shipStats().cargo*0.7))));
      list.push({id,type:t,dest:d,cid:c.id,qty:q,reward:Math.round(250+h*320+q*c.p*0.18),
        title:'Haul '+q+' '+c.n+' to '+SYSTEMS[d].n, desc:'Cargo is loaded at departure. Deliver it to '+SYSTEMS[d].st+'.', fac:S.fac==='talon'?'guild':S.fac});
    } else if (t==='courier'){
      list.push({id,type:t,dest:d,reward:Math.round(200+h*280),title:'Courier data to '+SYSTEMS[d].n,desc:'Sealed data chip. Takes no cargo space.',fac:S.fac});
    } else if (t==='smuggle'){
      const legal = dests.filter(([s])=>!SYSTEMS[s].bm);
      const [dd,hh] = pick(legal) || [d,h];
      const c = Math.random()<0.5?'stims':'arms', q = rint(3,8);
      list.push({id,type:t,dest:dd,cid:c,qty:q,reward:Math.round(600+q*260+hh*220),title:'Run '+q+' '+CID[c].n+' to '+SYSTEMS[dd].n,
        desc:'Contraband. Concord patrols will scan you. A Smuggler\'s Hold helps.',fac:'talon',rep:4});
    } else if (t==='fetch'){
      list.push({id,type:t,dest:sys,cid:'relic',qty:1,reward:1500,title:'Recover a Vael relic',desc:'Bring one Vael Relic back here. Relics can be bought on the Vesk black market, dropped by destroyed Vael ships, found by shooting asteroids in the Cinder and Gallow belts, or turned up in station crates.',fac:'archive',rep:5});
    } else {
      const danger = dests.filter(([s])=>SYSTEMS[s].danger>=1);
      const [ds] = pick(danger) || [d];
      const dg = Math.max(1,SYSTEMS[ds].danger);
      if (t==='bounty'){
        const nm = 'Captain '+pick(MNAMES);
        list.push({id,type:t,dest:ds,tag:id,name:nm,reward:900+dg*550,title:'Bounty: '+nm,desc:nm+' was last seen in '+SYSTEMS[ds].n+'. Wanted dead. Expect escorts.',fac:'concord',rep:4});
      } else if (t==='raid'){
        list.push({id,type:t,dest:ds,n:2,got:0,reward:2600,title:'Raid Guild haulers in '+SYSTEMS[ds].n,desc:'Destroy two Guild haulers there. Thorne wants them scared.',fac:'talon',rep:10});
      } else {
        const k = rint(3,5);
        list.push({id,type:'clear',dest:ds,n:k,got:0,reward:400+k*300+dg*150,title:'Clear '+k+' raiders from '+SYSTEMS[ds].n,desc:'Destroy '+k+' Red Talon ships in '+SYSTEMS[ds].n+'.',fac:'concord',rep:3});
      }
    }
  }
  return list;
}
function board(sys){
  const b = G.boards[sys];
  if (!b || b.day !== G.day) G.boards[sys] = {day:G.day, list:genBoard(sys)};
  return G.boards[sys].list;
}
function acceptMission(m){
  if (G.missions.length >= 5) return toast('You can hold at most 5 contracts','bad');
  if (m.qty && m.type!=='fetch'){
    if (cargoFree(m.cid) < m.qty) return toast('Not enough free cargo space','bad');
    G.mcargo[m.id] = {cid:m.cid, qty:m.qty};
  }
  G.missions.push(m);
  const b = G.boards[G.loc]; if (b) b.list = b.list.filter(x=>x!==m);
  toast('Contract accepted: '+m.title,'good'); sfx('click');
}
function abandonMission(m){
  G.missions = G.missions.filter(x=>x!==m); delete G.mcargo[m.id];
  if (m.fac) rep(m.fac, -3);
}
function completeMission(m){
  G.missions = G.missions.filter(x=>x!==m); delete G.mcargo[m.id];
  addCredits(m.reward, m.title); if (m.fac) rep(m.fac, m.rep||3);
  addXP(15 + Math.round(m.reward/120)); G.stats.missions++;
  journal('Completed: '+m.title); sfx('good');
}
function missionsOnDock(sys){
  for (const m of G.missions.slice()){
    if (m.dest!==sys) continue;
    if (m.type==='deliver'||m.type==='courier'||m.type==='smuggle') completeMission(m);
    else if (m.type==='fetch' && have(m.cid)>=m.qty){ give(m.cid,-m.qty); completeMission(m); }
  }
}
function missionsOnKill(e){
  for (const m of G.missions.slice()){
    if (m.type==='bounty' && e.tag===m.tag) completeMission(m);
    else if ((m.type==='clear'&&e.fac==='talon') || (m.type==='raid'&&e.fac==='guild')){
      if (G.loc===m.dest){ m.got++; if (m.got>=m.n) completeMission(m); else toast(m.title+': '+m.got+'/'+m.n); }
    }
  }
}

// ---------- save/load ----------
function saveGame(quiet){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); if (!quiet) toast('Game saved','good'); return true; }
  catch(e){ if (!quiet) toast('Saving is not available in this browser','bad'); return false; }
}
function loadGame(){
  try { const s = localStorage.getItem(SAVE_KEY); if (!s) return false; G = JSON.parse(s); migrate(); return true; }
  catch(e){ return false; }
}
function migrate(){
  if (!G.flags.mslGift){ G.flags.mslGift=1; G.upg.rack=Math.max(G.upg.rack||0,2); G.missiles=Math.max(G.missiles||0,8); }
  if (typeof G.flags.hunted==='string') G.flags.hunted=null;
  if (!G.tips && G.day > 4){ G.tips = {}; for (const k of ['walk','job1','K','O','S','J','W','m','bar']) G.tips[k] = 1; }   // veterans skip the basics
  if (!G.flags.holdV2){ G.flags.holdV2=1; if (G.upg.hold) G.upg.hold = 3; }
}
function huntedHere(sys){ const h=G.flags.hunted; return !!(h && h.sys===sys && h.day===G.day); }
function hasSave(){ try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; } }
function exportSave(){ try { return btoa(unescape(encodeURIComponent(JSON.stringify(G)))); } catch(e){ return ''; } }
function importSave(s){ try { G = JSON.parse(decodeURIComponent(escape(atob(s.trim())))); migrate(); return true; } catch(e){ return false; } }

// node: {t: text|fn, o:[[label, nextId|null, fx?, cond?]]}; fx may return a node id to override next.

function objective(){
  const cp = G.flags.concordPath, f = G.flags;
  switch (G.stage){
    case 'intro': return "Speak with Dockmaster Oskar in Haldane Spire.";
    case 's1_cinder': return "Fly to Cinder and ask around Cinder Deep about Mara.";
    case 's1_beacon': return "Find Mara's distress beacon in Cinder's asteroid field.";
    case 's2_box': return "Get the black box opened: Sister Ilse (Ostra) or Needle (Vesk). Or sell it unopened to Commander Hale (Meridian).";
    case 's3_seed':

    case 's5_echo': return "Search the dark Relay. Find the source of the music.";
    case 's6_threnody': return "Jump from Sable through the reopened Lantern to Threnody.";
    case 's6_heart': return "Approach the Heart.";
    case 'end_return': return "Defend the Heart. Destroy Commander Hale's flagship, the Dauntless.";
    case 'end_concord': return "Destroy the Vael Choir defending the Heart.";
    case 'end_keep': return "Escape with the seed. Bring it to Ruska Thorne at Vesk Hollow.";
    case 'end_burn': return "Destroy the Heart.";
    case 'done': return "The story is told. The Reach is yours to roam.";
  }
  return '';
}

function storyHint(){
  switch (G.stage){
    case 'intro': return "Oskar's been asking after you. He's the dockmaster, usually hanging round the concourse.";
    case 's1_cinder': return "Mara? Last I heard she was headed out Cinder way. Lane's direct from Haldane.";
    case 's1_beacon': return "Beacons in the belt draw scavengers. And worse. Check your shields before you go poking.";
    case 's2_box': return "Locked boxes? The Archivists at Ostra crack old Concord codes for fun. Or there's a slicer at Vesk called Needle, if you've got the coin.";
    case 's3_seed': return "The Gravemaw's Thorne's own ship. Big, slow, nasty missiles. Bring friends or bring money.";
    case 's4_relics': return "Vael relics turn up on the Vesk black market. Choirling wrecks carry them too, if you're brave or stupid. Deep rocks in Cinder and Gallow sometimes yield one.";
    case 's5_sable': case 's5_echo': return "Nobody goes to Sable. The ones who do come back quiet.";
    case 's6_threnody': case 's6_heart': return "A lane to somewhere past Sable? Hah. If that's true, the whole Reach changes tomorrow.";
  }
  return pick(RUMORS);
}

function tradeTip(sys){
  let best=null;
  for (const c of COMMODS){
    if (!canBuy(sys,c.id) || c.ill || c.rare) continue;
    const bp = buyPrice(sys,c.id);
    for (const l of linksOf(sys)){
      if (!canSell(l,c.id)) continue;
      const sp = sellPrice(l,c.id), r = sp - bp;
      if (!best || r > best.r) best = {c, l, bp, sp, r};
    }
  }
  if (!best || best.r<=0) return "Nothing's moving well from here right now. Try the next system over.";
  return "Word is "+best.c.n+" goes for about "+best.bp+" here and fetches "+best.sp+" in "+SYSTEMS[best.l].n+". Fill your hold.";
}

function payOr(n, ok, fail){ return () => { if (G.credits < n){ toast('Not enough credits','bad'); return fail; } addCredits(-n); return ok; }; }

function bartender(name, sys, flav){
  const buy = () => { if (G.credits<15){ toast('Not enough credits','bad'); return 'hi'; } addCredits(-15); if (drinkOne()==='blackout') return 'out'; };
  const round = () => { if (G.credits<60){ toast('Not enough credits','bad'); return 'hi'; } addCredits(-60); rep(SYSTEMS[sys].fac, 1, true); if (drinkOne()==='blackout') return 'out'; return 'round'; };
  const coffee = () => { if (G.credits<5){ toast('Not enough credits','bad'); return 'hi'; } addCredits(-5); G.drunk = Math.max(0,(G.drunk||0)-3); G.hangover = 0; };
  const tip = () => { const t = tipsyText(); return t ? '\n\n('+t+')' : ''; };
  return {n:name, role:'Bartender', c:'#e0a96d', start:()=>'hi', N:{
    hi:{t:()=>flav+tip(), o:[
      ['Buy a drink and listen (15 cr)','rumor',buy],
      ['Buy a round for the whole bar (60 cr)','round',round],
      ['Coffee, black. (5 cr) Sobers you up','coffee',coffee,()=>(G.drunk||0)>0||G.hangover],
      ['Heard anything that might help me?','hint'],
      ['Where\'s the money in trade right now?','tip'],
      ['Nothing. See you around.',null]]},
    out:{t:'…', o:[['…',null]]},
    rumor:{t:()=>'"'+pick(RUMORS)+'"'+tip(), o:[['Another (15 cr)','rumor',buy],['Coffee instead (5 cr)','coffee',coffee,()=>(G.drunk||0)>=3],['Thanks.',null]]},
    round:{t:()=>'The bar cheers. Someone starts a song about you. It rhymes "pilot" with "violet".'+tip(), o:[['Another round! (60 cr)','round',round],['That\'ll do.','hi']]},
    coffee:{t:()=>'"Strong enough to strip paint," says '+name+'. Your head clears.'+tip(), o:[['Thanks.','hi']]},
    hint:{t:()=>'"'+storyHint()+'"', o:[['Thanks.','hi']]},
    tip:{t:()=>'"'+tradeTip(sys)+'"', o:[['Good to know.','hi']]}
  }};
}

// ===================== 3D space flight =====================
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vmul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const vmad=(a,b,s)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s];
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vlen=a=>Math.hypot(a[0],a[1],a[2]);
const vnorm=a=>{const l=vlen(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const vdist=(a,b)=>vlen(vsub(a,b));
function vrot(v,ax,ang){const c=Math.cos(ang),s=Math.sin(ang),d=vdot(ax,v),cr=vcross(ax,v);
  return [v[0]*c+cr[0]*s+ax[0]*d*(1-c), v[1]*c+cr[1]*s+ax[1]*d*(1-c), v[2]*c+cr[2]*s+ax[2]*d*(1-c)];}
function randUnit(){ const z=rnd(-1,1), t=rnd(Math.PI*2), r=Math.sqrt(1-z*z); return [r*Math.cos(t), z, r*Math.sin(t)]; }
function reorth(e){ e.f=vnorm(e.f); e.r=vnorm(vcross(e.u,e.f)); e.u=vcross(e.f,e.r); }
function lookAt(e, dir, up){ e.f=vnorm(dir); e.u=up||[0,1,0]; if (Math.abs(vdot(e.f,e.u))>0.98) e.u=[1,0,0]; reorth(e); }
function turnToward(e, dir, maxA){
  dir=vnorm(dir); const d=clamp(vdot(e.f,dir),-1,1), ang=Math.acos(d); if (ang<1e-4) return ang;
  let ax=vcross(e.f,dir); if (vlen(ax)<1e-6) ax=e.u; ax=vnorm(ax);
  const a=Math.min(ang,maxA); e.f=vrot(e.f,ax,a); e.u=vrot(e.u,ax,a); reorth(e); return ang;
}
function hexRGB(h){ h=h.replace('#',''); if (h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

// ---------- meshes ----------
function part(v,f,o={}){ return {v,f,col:o.col||1,glow:o.glow||0,gc:o.gc}; }
function boxP(x0,x1,y0,y1,z0,z1,o){ return part([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],
  [[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]],o); }
function prismP(n,r,z0,z1,o,rot=0){ const v=[],f=[]; for(let i=0;i<n;i++){const a=rot+i/n*Math.PI*2; v.push([Math.cos(a)*r,Math.sin(a)*r,z0],[Math.cos(a)*r,Math.sin(a)*r,z1]);}
  for(let i=0;i<n;i++){const j=(i+1)%n; f.push([i*2,j*2,j*2+1,i*2+1]);} f.push([...Array(n)].map((_,i)=>i*2)); f.push([...Array(n)].map((_,i)=>i*2+1)); return part(v,f,o); }
function octaP(cx,cy,cz,rx,ry,zf,zb,o){ return part([[cx,cy,cz+zf],[cx,cy,cz-zb],[cx-rx,cy,cz],[cx+rx,cy,cz],[cx,cy+ry,cz],[cx,cy-ry,cz]],
  [[0,2,4],[0,4,3],[0,3,5],[0,5,2],[1,4,2],[1,3,4],[1,5,3],[1,2,5]],o); }
function icoP(j){ const t=(1+Math.sqrt(5))/2; let v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  v=v.map(p=>vmul(vnorm(p),1+rnd(-j,j)));
  const f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  return part(v,f); }
function buildMesh(parts){
  const v=[],f=[]; let r=0;
  for (const p of parts){
    const base=v.length, c=[0,0,0]; p.v.forEach(q=>{c[0]+=q[0];c[1]+=q[1];c[2]+=q[2];}); const cen=vmul(c,1/p.v.length);
    for (const fc of p.f){
      let idx=fc.slice(); const a=p.v[idx[0]],b=p.v[idx[1]],cc=p.v[idx[2]];
      const n=vcross(vsub(b,a),vsub(cc,a)); const fcn=[0,0,0]; idx.forEach(k=>{fcn[0]+=p.v[k][0];fcn[1]+=p.v[k][1];fcn[2]+=p.v[k][2];});
      if (vdot(n, vsub(vmul(fcn,1/idx.length),cen))<0) idx.reverse();
      f.push({i:idx.map(k=>k+base), col:p.col, glow:p.glow, gc:p.gc?hexRGB(p.gc):null});
    }
    p.v.forEach(q=>{v.push(q); r=Math.max(r,vlen(q));});
  }
  return {v,f,r};
}

function mkEnt(o){
  const e = Object.assign({id:Math.random().toString(36).slice(2), pos:[0,0,0], vel:[0,0,0], f:[0,0,1], u:[0,1,0], r:[1,0,0], scale:1, hp:1, maxHp:1, sh:0, maxSh:0, side:'neutral', flash:0, lastHit:-99, cd:0}, o);
  e.rad = (e.mesh ? e.mesh.r : 5) * e.scale;
  if (e.rgb===undefined) e.rgb = hexRGB(e.c||'#aaaaaa');
  return e;
}
function spawnShip(cls, pos, side, extra){
  const C = SHIPCLS[cls];
  const e = mkEnt(Object.assign({kind:'ship', cls, name:C.n, fac:C.fac, mesh:MESH[C.mesh], c:C.c, scale:(C.scale||1)*(C.static?1:SHIP_SCALE), pos:pos.slice(),
    hp:C.hull, maxHp:C.hull, sh:C.sh, maxSh:C.sh, side, ai:{mode:'idle', t:0, msl:C.msl||0}, static:!!C.static}, extra||{}));

}
function sysSeedVec(id, k){ let h=0; for (const ch of id+k) h=(h*31+ch.charCodeAt(0))|0; const a=(h%1000)/1000*Math.PI*2, b=((h>>10)%1000)/1000*0.6-0.3; return vnorm([Math.cos(a),b,Math.sin(a)]); }

function enterSpace(sysId, from){

  S = {sys:sysId, ents:[], shots:[], parts:[], floats:[], dust:[], hitT:0, muzzle:0, t:0, ts:1, target:null, auto:null, encT:rnd(25,45), flags:{}, msgs:[], view:S&&S.view||'cockpit', shake:0, cam:null};
  // stars
  S.stars = []; for (let i=0;i<260;i++) S.stars.push({d:randUnit(), b:rnd(0.25,1)});

  S.sunRGB = hexRGB(sys.sun); S.plRGB = hexRGB(sys.pl.c);
  // gate
  const gdir = sysSeedVec(sysId,'gate');
  S.gate = mkEnt({kind:'gate', name:'Lantern', mesh:MESH.gate, c:'#b8a070', pos:vmul(gdir,3800)}); lookAt(S.gate, vmul(gdir,-1)); S.ents.push(S.gate);
  S.gate.dead_lantern = (sysId==='sable' && !G.flags.laneOpen);
  if (sys.st){
    S.station = mkEnt({kind:'station', name:sys.st, mesh:MESH.station, c:sys.derelict?'#555a66':'#a9b4c4', pos:[0,0,0]});
    lookAt(S.station, gdir); S.ents.push(S.station);
  } else S.station = null;
  if (sys.ast){
    const fdir = vnorm(vcross(gdir,[0,1,0])); S.field = vmul(fdir, 2600);
    for (let i=0;i<26;i++){
      const p = vadd(S.field, [rnd(-900,900), rnd(-300,300), rnd(-900,900)]);
      const sc = rnd(14,48);
      const e = mkEnt({kind:'rock', name:'Asteroid', mesh:pick(MESH.rocks), c:pick(['#7a6a5a','#6a6058','#857565','#5e5a55']), pos:p, scale:sc, hp:sc*1.4, maxHp:sc*1.4, spin:rnd(-0.3,0.3)});
      lookAt(e, randUnit()); S.ents.push(e);
    }
  }
  // player
  const st = shipStats();
  P = mkEnt({kind:'player', name:G.shipName, mesh:MESH[HULLS[G.hull].mesh], c:HULLS[G.hull].c, scale:SHIP_SCALE, hp:G.hp, maxHp:st.hull, sh:G.sp, maxSh:st.sh, side:'player', energy:100, wcd:[0,0,0], wi:0});
  if (from==='station' && S.station){
    P.pos = vmad(S.station.pos, S.station.f, 560); lookAt(P, S.station.f);
    P.vel = vmul(P.f, 60);
  } else {
    P.pos = vmad(S.gate.pos, vmul(gdir,-1), 260); lookAt(P, vmul(gdir,-1)); P.vel = vmul(P.f, 120);
  }
  CTRL.thr = 0.6; CTRL.pitch=CTRL.yaw=CTRL.roll=0;
  if (from==='station' && G.hangover){ G.hangover=0; S.hangT = 60; setTimeout(()=>msg('Ugh. Your head is pounding and everything is blurry.','#ffd27a'), 300); }
  // initial encounters
  if (sys.econ!=='none'){
    if (Math.random()<0.65) spawnEncounter(rollEncounter(), true);
    if (S.station && Math.random()<0.5) spawnTraders(true);
  }
  storyEnter(sysId);
  missionsEnter(sysId);
  // Concord checkpoints watch the lanes around Vesk for stolen goods and contraband
  if (from==='gate' && ['vesk','cinder','brine','gallow'].includes(sysId) && hasContraband() && Math.random()<0.4){
    S.flags.checkpoint = 1;
    for (let i=0;i<2;i++){ const e=spawnShip('cutter', vadd(vmad(P.pos,P.f,500),[i?70:-70,0,0]), isWanted()?'hostile':'neutral', {name:'Checkpoint Cutter'}); e.ai.mode='patrol'; e.ai.home=vmad(P.pos,P.f,300); }
    msg('Concord checkpoint at the Lantern! They are scanning traffic.','#6aa8ff');
  }
  // station security looking for you after a botched break-in
  if (from==='station' && huntedHere(sysId)){
    G.flags.hunted = null;
    const fac = SYSTEMS[sysId].fac;
    for (let i=0;i<2;i++){ const e=spawnShip('cutter', vmad(vmad(P.pos,P.f,900),P.r,i?120:-120), 'hostile', {name:'Station Security', fac:fac==='talon'?'talon':fac, c:'#e8e8ff'}); e.rgb=hexRGB('#e8e8ff'); e.ai.mode='hunt'; }
    msg('Station security is waiting for you: they were told about the break-in!','#ff6a5a'); sfx('alarm');
  }
  setMode('space');
  msg('Entering '+sys.n+(sys.st?' — '+sys.st+' on scanner':''), '#9fe8ff');
}

// ---------- encounters ----------
const ENC = {
  haldane:{patrol:.5, trader:.3, pirate:.2}, meridian:{patrol:.65, trader:.3, pirate:.05}, ostra:{trader:.5, pirate:.25, patrol:.25},
  tolle:{trader:.5, pirate:.35, patrol:.15}, brine:{trader:.45, pirate:.45, patrol:.1}, cinder:{pirate:.55, trader:.35, patrol:.1},
  vesk:{pirate:.8, trader:.2}, gallow:{pirate:.55, trader:.3, vael:.15}, sable:{vael:1}, threnody:{}
};
function rollEncounter(){
  const t = ENC[S.sys] || {}; let r = Math.random(), acc=0;
  for (const k in t){ acc+=t[k]; if (r<acc) return k; } return null;
}
function pirateSide(){
  if (G.rep.talon>=30) return 'neutral';
  if (S.sys==='vesk' && G.rep.talon>=-20) return 'neutral';
  return 'hostile';
}
function spawnPos(dmin, dmax){
  const dir = vnorm(vadd(vmul(P.f, 0.9), randUnit()));
  return vmad(P.pos, dir, rnd(dmin,dmax));
}
function spawnEncounter(kind, initial){
  if (!kind) return;
  const dg = SYSTEMS[S.sys].danger;
  const pos = spawnPos(initial?1700:1500, initial?2400:2000);
  const jitter = () => vadd(pos,[rnd(-120,120),rnd(-80,80),rnd(-120,120)]);
  if (kind==='pirate'){
    const side = pirateSide(), grp = 'g'+Math.random();
    const list = dg<=1 ? ['skiff', Math.random()<0.5?'skiff':null] : dg===2 ? ['raider', pick(['skiff','raider',null])] : ['marauder','raider', Math.random()<0.4?'raider':null];
    list.filter(Boolean).forEach(c => { const e=spawnShip(c, jitter(), side, {grp}); e.ai.mode = side==='hostile'?'hunt':'wander'; e.ai.home=pos; });
    if (side==='hostile'){ msg('Red Talon raiders on scanner!','#ff6a5a'); sfx('alarm'); S.pendingHail = grp; }
  } else if (kind==='patrol'){
    const side = isWanted() ? 'hostile' : 'neutral';
    for (let i=0;i<2;i++){ const e=spawnShip('cutter', jitter(), side); e.ai.mode='patrol'; e.ai.home=S.station?S.station.pos:pos; }
    if (side==='hostile'){ msg('Concord patrol: "You are wanted. Power down!"','#6aa8ff'); sfx('alarm'); }
  } else if (kind==='trader'){ spawnTraders(false);
  } else if (kind==='vael'){
    const side = G.rep.vael<=-40 ? 'hostile' : 'neutral';
    const n = rint(2,3); for (let i=0;i<n;i++){ const e=spawnShip('choir', jitter(), side, {tag:'vaelwild'}); e.ai.mode='drift'; e.ai.home=pos; }
    msg('Unknown crystalline contacts. Vael.','#7ff0d8');
  }
}
function spawnTraders(initial){
  if (!S.station) return;
  const toStation = Math.random()<0.5;
  const from = toStation ? vmad(S.gate.pos, randUnit(), 300) : vmad(S.station.pos, S.station.f, 300);
  const dest = toStation ? S.station.pos : S.gate.pos;
  const n = Math.random()<0.4?2:1;
  for (let i=0;i<n;i++){
    const p = initial ? vadd(vmad(from, vnorm(vsub(dest,from)), rnd(300, vdist(from,dest)*0.7)), [rnd(-80,80),rnd(-40,40),rnd(-80,80)]) : vadd(from,[i*60,0,i*40]);
    const e = spawnShip('hauler', p, 'neutral'); e.ai.mode='travel'; e.ai.dest=dest; lookAt(e, vsub(dest,p));
  }
}
function missionsEnter(sysId){
  for (const m of G.missions){
    if (m.type==='bounty' && m.dest===sysId){
      const pos = spawnPos(2400,3200);
      const cap = spawnShip('captain', pos, 'hostile', {tag:m.tag, name:m.name}); cap.ai.mode='hunt';
      for (let i=0;i<rint(1,2);i++){ const e=spawnShip(SYSTEMS[sysId].danger>=3?'raider':'skiff', vadd(pos,[rnd(-150,150),rnd(-60,60),rnd(-150,150)]), 'hostile'); e.ai.mode='hunt'; }
      msg('Bounty target '+m.name+' detected!','#ffaa44');
    }
    if (m.type==='raid' && m.dest===sysId){ spawnTraders(true); spawnTraders(true); }
    if (m.type==='clear' && m.dest===sysId){ const k='pirate'; spawnEncounter(k,true); }
  }
}

    if (st==='s6_threnody'){ setStage('s6_heart'); msg('A colossal crystal turns slowly in the light of a green sun. The Heart.','#7ff0d8'); }
    if (st==='end_return'||st==='end_concord'||st==='end_burn'||st==='end_keep') spawnFinale(st.slice(4), true);
  } else if (st==='end_keep' && sysId!=='vesk'){
    for (let i=0;i<2;i++){ const e=spawnShip('cutter', spawnPos(1500,2000), 'hostile'); e.ai.mode='hunt'; }
    msg('Concord hunters followed you through the Lantern!','#6aa8ff');

function storyUpdate(dt){
  const f = G.flags;
  if (S.beacon && !S.beacon.dead){
    const d = vdist(P.pos, S.beacon.pos);
    if (!S.flags.ambush && d<650){
      S.flags.ambush = 1;
      for (const c of ['raider','skiff','skiff']){ const e=spawnShip(c, vmad(S.beacon.pos, randUnit(), 400), 'hostile', {tag:'ambush'}); e.ai.mode='hunt'; }

    }
    if (S.flags.ambush && !S.ents.some(e=>e.tag==='ambush'&&!e.dead) && d<90){
      S.beacon.dead = true; f.hasBox = 1; sfx('good');
      msg("Recovered the Gilded Hour's black box.",'#9fe8ff');

      setStage('s2_box');
    }
  }

    const e=spawnShip('widow', spawnPos(1200,1600), 'hostile', {tag:'widow'}); e.ai.mode='hunt'; msg('A white hull slides out of nowhere. The Widow!','#ffffff'); sfx('alarm'); } }

}
function storyKill(e){
  const f=G.flags;
  if (e.tag==='ambush' && !S.ents.some(x=>x.tag==='ambush'&&!x.dead)) msg('Ambush cleared. Fly into the beacon to recover the black box.','#9fe8ff');
  if (e.tag==='gravemaw'){
    f.gravemawDead=1;
    const c = spawnCan(e.pos, {}); c.seed = true; c.name='Sealed cradle'; c.c='#7ff0d8'; c.rgb=hexRGB('#7ff0d8');

  }
  if (e.tag==='ledger'){ f.ledgerDead=1; rep('concord',-10); toast('Objective: '+objective(),'story'); }
  if (e.tag==='widow'){ f.sqWidow=2; toast('The Widow is dead. Return to Bracken at Gallow Point.','story'); }
  if (e.tag==='dauntless' && G.stage==='end_return') setTimeout(()=>triggerEnding('return'), 1800);
  if (e.tag==='choir' && G.stage==='end_concord' && !S.ents.some(x=>x.tag==='choir'&&!x.dead)) setTimeout(()=>triggerEnding('concord'), 1800);
  if (e.tag==='heart' && G.stage==='end_burn'){ for (let i=0;i<6;i++) setTimeout(()=>explode(vadd(e.pos,vmul(randUnit(),rnd(40,160))),8),i*250); setTimeout(()=>triggerEnding('burn'), 2500); }
}
function jettison(keys, quiet){
  const it = {};
  for (const k of keys){ if (G.cargo[k]>0){ it[k] = G.cargo[k]; delete G.cargo[k]; } }
  // contraband contract cargo goes too, failing the contract
  if (quiet) for (const id in G.mcargo){ const mc = G.mcargo[id]; if (CID[mc.cid] && CID[mc.cid].ill){ it[mc.cid] = (it[mc.cid]||0) + mc.qty; const m = G.missions.find(x=>x.id===id); if (m){ G.missions = G.missions.filter(x=>x!==m); toast('Contract failed: '+m.title,'bad'); } delete G.mcargo[id]; } }
  if (!Object.keys(it).length) return;
  const c = spawnCan(vmad(P.pos, P.f, -60), it); c.life = 600; c.vel = vmul(P.f, -15); c.jett = 1; c.name = 'Your jettisoned cargo';
  S.jettCool = 4;
  if (!quiet) msg('Cargo jettisoned. It\'s floating behind you.','#d8d0a0');
  sfx('click');
}
function pickupSpecial(c){
  if (c.seed){ giveSeed(); if (G.flags.concordPath) msg('Cutter wing: "Cargo secured. Take it to Dr. Quill at Meridian."','#6aa8ff'); return true; }

}

function finaleChoice(k){

function spawnFinale(k, reentry){
  const hp = vmad(S.heart.pos, vnorm(vsub(P.pos,S.heart.pos)), 3000);

// ---------- combat ----------
function spawnCan(pos, items){
  const e = mkEnt({kind:'can', name:'Cargo canister', mesh:MESH.can, c:'#d8d0a0', pos:vadd(pos,vmul(randUnit(),rnd(5,25))), items, life:120, spin:rnd(-1,1)});
  e.vel = vmul(randUnit(), rnd(5,20)); lookAt(e, randUnit()); S.ents.push(e); return e;
}
function lootFor(e){
  const C = SHIPCLS[e.cls]; if (!C) return;
  const legal = COMMODS.filter(c=>!c.ill&&!c.rare&&!c.hot);
  if (C.loot==='trade'){ const it={}; for (let i=0;i<rint(2,3);i++) it[pick(legal).id]=rint(2,5); spawnCan(e.pos,it); }
  else if (C.loot==='relic'){ if (Math.random()<0.45) spawnCan(e.pos,{relic:1}); }
  else if (e.fac==='talon' && Math.random()<(C.boss?1:0.55)){ const it={}; const c = Math.random()<0.25?pick(['stims','arms']):pick(legal).id; it[c]=rint(1,C.boss?8:4); spawnCan(e.pos,it); }
}
function explode(pos, size=1){
  for (let i=0;i<14+size*10;i++){ const v=vmul(randUnit(), rnd(20,120)*Math.sqrt(size));
    S.parts.push({p:pos.slice(), v, life:rnd(0.5,1.3), max:1.3, c:pick(['#ffd27a','#ff8a4a','#ffffff','#ff5a3a']), s:rnd(1.5,4)*Math.sqrt(size)}); }
  S.parts.push({p:pos.slice(), v:[0,0,0], life:0.35, max:0.35, c:'#ffffff', s:14*size, flash:1});
  S.parts.push({p:pos.slice(), v:[0,0,0], life:0.7, max:0.7, c:'#ffd27a', s:10*size, ring:1});
  if (comicOn()) S.parts.push({p:pos.slice(), v:[0,0,0], life:0.75, max:0.75, s:9*size, burst:1, seed:rnd(6), word: size>=0.9 ? pick(size>=2.5?SFX_WORDS.big:SFX_WORDS.boom) : null});
  for (let i=0;i<6+size*3;i++) S.parts.push({p:pos.slice(), v:vmul(randUnit(), rnd(30,90)*Math.sqrt(size)), life:rnd(1.2,2.4), max:2.4, c:'#6a6a70', s:rnd(1.5,3)*Math.sqrt(size), debris:1});
  if (vdist(pos,P.pos)<1800) sfx('boom');
}
function provoke(e){
  if (e.side!=='neutral' || e.static) return;
  e.side='hostile'; e.ai.mode='hunt'; e.provoked = 1;
  rep(e.fac, -4);
  for (const o of S.ents) if (o!==e && o.kind==='ship' && o.fac===e.fac && o.side==='neutral' && !o.static && vdist(o.pos,e.pos)<2600){ o.side='hostile'; o.ai.mode='hunt'; }
  if (e.fac==='concord') msg('Concord: "Unprovoked attack on a Concord vessel! Engaging."','#6aa8ff');
  else if (e.fac==='guild') msg('Guild hauler: "Mayday! Pirate attack!"','#e8c35a');
  else if (e.fac==='vael') msg('The Vael song turns to a shriek.','#7ff0d8');
  else if (e.fac==='talon') msg('Talon: "You just made a big mistake."','#ff6a5a');
}
function hurt(e, dmg, shm, hm, byPlayer){
  if (e.dead) return;
  if (e.kind==='rock'){ e.hp-=dmg; e.flash=0.1; if (byPlayer) S.hitT=0.12; if (e.hp<=0){ e.dead=true; explode(e.pos, e.scale/14);
      const n=rint(1,2); for (let i=0;i<n;i++) spawnCan(e.pos,{ore:rint(2,4)});
      if (Math.random()<(S.sys==='gallow'?0.07:0.045)) { spawnCan(e.pos,{relic:1}); msg('Something glints inside the shattered rock...','#7ff0d8'); }
    } return; }
  if (e.kind!=='ship' && e.kind!=='player') return;
  if (e.static && e.side!=='hostile') return;
  if (e===P) dmg *= DIFF[SETTINGS.diff]||1;
  let d = dmg; const sh0 = e.sh, hp0 = e.hp;
  if (e.sh>0){ const sd=d*shm; if (sd<=e.sh){ e.sh-=sd; d=0; } else { d=(sd-e.sh)/shm; e.sh=0; } }
  if (d>0) e.hp -= d*hm;
  e.flash=0.12; e.lastHit=S.t;
  if (sh0 - e.sh > 0.01) e.shHit = 0.22;
  if (byPlayer && e!==P){ S.hitT = 0.18; const dealt = Math.round((sh0-e.sh)+(hp0-Math.max(e.hp,0))); if (dealt>0 && SETTINGS.dmgNums!==false) S.floats.push({p:vadd(e.pos,[rnd(-4,4),e.rad*0.6,rnd(-4,4)]), t:String(dealt), c:e.sh>0?'#8fd8ff':'#ffb36a', life:0.9}); }
  if (e===P){ S.shake = Math.min(1, S.shake+0.35); sfx(d>0?'hullhit':'shieldhit'); if (P.hp<=0) playerDie(); return; }
  if (byPlayer && e.side==='neutral') provoke(e);
  if (e.hp<=0) kill(e, byPlayer);
}
function kill(e, byPlayer){
  e.dead = true; explode(e.pos, (e.scale||1)*(SHIPCLS[e.cls]&&SHIPCLS[e.cls].boss?3:1.2));
  const C = SHIPCLS[e.cls]||{};
  if (S.target===e) S.target=null;
  if (byPlayer){
    G.stats.kills++; if (G.kills[e.fac]!==undefined) G.kills[e.fac]++;
    addXP(C.xp||10);
    if (e.fac==='talon'){ if (e.provoked) rep('talon',-3,true); else if (G.rep.talon > -12) rep('talon',-1,true);   // they jumped you: Vesk shrugs, mostly
      rep('concord',2,true); if (C.bounty && G.rep.concord>-30) addCredits(C.bounty,'Concord bounty: '+e.name); }
    else if (e.fac==='concord'){ rep('concord',-15); rep('talon',5,true); }
    else if (e.fac==='guild'){ rep('guild',-10); rep('concord',-6); rep('talon',4,true); }
    else if (e.fac==='vael' && e.tag!=='choir'){ rep('vael',-15); rep('archive',-5,true); }
  }
  lootFor(e);
  missionsOnKill(e);
  storyKill(e);
}
function playerDie(){
  if (P.dead) return;
  P.dead = true; explode(P.pos, 3); S.deadT = 2.2; sfx('boom');
}
function fireShot(owner, from, dir, W, friendly, dmgMul){
  S.shots.push({p:from, v:vadd(vmul(dir, W.spd), owner.vel||[0,0,0]), life:1.45, dmg:W.dmg*(dmgMul||1), shm:W.shm||1, hm:W.hm||1, friendly, owner, c:W.c, rgb:hexRGB(W.c)});
}
function leadPoint(from, t, spd){
  let p = t.pos; for (let i=0;i<2;i++){ const tt = vdist(from,p)/spd; p = vmad(t.pos, t.vel, tt); } return p;
}
function playerFire(dt){
  const st = shipStats();
  for (let i=0;i<G.weapons.length;i++){
    P.wcd[i] = (P.wcd[i]||0) - dt;
    if (!CTRL.fire || P.wcd[i]>0) continue;
    const W = WEAPONS[G.weapons[i]]; if (!W) continue;
    P.wcd[i] = 1/W.rate;
    const side = G.weapons.length===1 ? (P.wi++%2?1:-1)*3.2 : (i===0?-4.5:i===1?4.5:0);
    const from = vadd(vadd(vmad(P.pos,P.f,8), vmul(P.r,side)), vmul(P.u,-2.6));
    let dir = P.f;
    const t = S.target;
    if (SETTINGS.assist && t && !t.dead && (t.kind==='ship'||t.kind==='rock') && !(t.static && t.side!=='hostile')){
      const lp = leadPoint(from, t, W.spd), dd = vnorm(vsub(lp,from));
      if (vdot(dd,P.f)>0.976 && vdist(t.pos,P.pos)<1700) dir = dd;
    }
    fireShot(P, from, dir, W, true, st.dmgMul);
    S.muzzle = 0.07; S.muzzleSide = side; S.muzzleC = W.c;
    sfx('laser', G.weapons[i]);
  }
}
function fireMissile(){
  if (G.missiles<=0) return msg('No missiles. Buy them at an outfitter (needs a rack).','#ffaa66');
  const t = S.target; if (!t || t.dead || t.kind!=='ship') return msg('Select a target first (TGT).','#ffaa66');
  G.missiles--; S.shots.push({p:vmad(vmad(P.pos,P.u,-4),P.f,8), v:vadd(vmul(P.f,220),P.vel), life:8, dmg:60*shipStats().dmgMul, shm:1, hm:1.2, friendly:true, owner:P, msl:true, tgt:t, c:'#ffdd88', rgb:[255,221,136]});
  sfx('missile');
}

// ---------- AI ----------
function enemiesOf(e){
  if (e.side==='hostile'){ const l = S.ents.filter(o=>o.kind==='ship'&&o.side==='ally'&&!o.dead); if (!P.dead) l.push(P); return l; }
  if (e.side==='ally') return S.ents.filter(o=>o.kind==='ship'&&o.side==='hostile'&&!o.dead&&!o.static);
  return [];
}
function nearest(e, list, max=4500){ let b=null, bd=max; for (const o of list){ const d=vdist(o.pos,e.pos); if (d<bd){bd=d;b=o;} } return b; }
function aiUpdate(e, dt){
  const C = SHIPCLS[e.cls], ai = e.ai;
  if (e.static){ return; }
  ai.cd = (ai.cd||0) - dt; ai.t += dt;
  let dir = e.f, spd = C.spd*0.6;
  if (e.side==='hostile' || e.side==='ally'){
    if (!ai.tgt || ai.tgt.dead || Math.random()<dt*0.3) ai.tgt = nearest(e, enemiesOf(e), ai.mode==='guard'?1800:4500);
  } else ai.tgt = null;
  const t = ai.tgt;
  if (ai.mode==='flee'){
    dir = vnorm(vsub(e.pos, P.pos)); spd = C.spd;
    if (vdist(e.pos,P.pos)>3800){ e.dead=true; e.escaped=true; }
  } else if (t){
    const to = vsub(t.pos, e.pos), d = vlen(to);
    const aim = leadPoint(e.pos, t, 900);
    const tspd = vlen(t.vel||[0,0,0]);
    if (ai.mode==='evade'){ ai.et -= dt; dir = ai.ev; spd = C.spd*AI_COMBAT_SPEED; if (ai.et<=0) ai.mode='hunt'; }
    else {
      if (ai.mode!=='hunt' && ai.mode!=='escort') ai.mode='hunt';
      dir = vnorm(vsub(aim, e.pos));
      // close in at full speed, then settle to roughly the target's pace so fights stay readable
      spd = d>900 ? C.spd*0.85 : d>450 ? C.spd*AI_COMBAT_SPEED : clamp(tspd*0.85, 35, C.spd*0.45);
      if (d < 120 + e.rad + (t.rad||5)){ ai.mode='evade'; ai.et=rnd(1.4,2.4); ai.ev = vnorm(vadd(vadd(vmul(e.r,rnd(-0.6,0.6)),vmul(e.u,rnd(-0.6,0.6))),vmul(e.f,1.0))); }
      const fdir = vnorm(vsub(aim,e.pos));
      const acc = C.boss ? 0.975 : 0.982;
      if (vdot(e.f,fdir)>acc && d<1000 && ai.cd<=0 && C.dmg>0){
        ai.cd = 1/C.rate * rnd(0.85,1.3);
        const err = vmul(randUnit(), e.side==='ally'?0.02:0.035);
        const from = vmad(e.pos, e.f, e.rad*0.8);
        fireShot(e, from, vnorm(vadd(fdir,err)), {dmg:C.dmg, spd:900, c:e.side==='ally'?'#88ffaa':(e.fac==='vael'?'#77ffdd':'#ff6655')}, e.side==='ally');
        if (vdist(e.pos,P.pos)<1200) sfx('elaser');
      }
      if (ai.msl>0 && d<1600 && d>300 && Math.random()<dt*0.12){
        ai.msl--; S.shots.push({p:vmad(e.pos,e.f,e.rad), v:vmul(e.f,220), life:9, dmg:28, shm:1, hm:1.2, friendly:e.side==='ally', owner:e, msl:true, tgt:t, c:'#ff9966', rgb:[255,153,102]});
        if (t===P){ msg('MISSILE LAUNCH DETECTED!','#ff5a4a'); sfx('alarm'); }
      }
      if (C.fac==='talon' && !C.boss && e.tag!=='ambush' && e.hp < e.maxHp*0.25 && !ai.fled){ ai.fled=true; if (Math.random()<0.5){ ai.mode='flee'; msg(e.name+' is fleeing!','#ffaa66'); } }
    }
  } else {
    if (ai.mode==='travel' && ai.dest){
      dir = vnorm(vsub(ai.dest,e.pos)); spd = C.spd;
      if (vdist(ai.dest,e.pos)<180){ e.dead=true; e.escaped=true; }
    } else if (ai.mode==='escort' || (e.side==='ally')){
      const tp = vmad(vmad(P.pos, P.r, (e.id.charCodeAt(0)%2?1:-1)*80), P.f, -60);
      const dd = vsub(tp, e.pos); const d=vlen(dd);
      dir = d>40 ? vnorm(dd) : P.f; spd = d>200 ? C.spd : Math.max(40, vlen(P.vel));
    } else if (ai.mode==='patrol' || ai.mode==='wander' || ai.mode==='drift' || ai.mode==='guard' || ai.mode==='hunt' || ai.mode==='idle'){
      const home = ai.home || e.pos;
      if (!ai.wp || vdist(ai.wp,e.pos)<150) ai.wp = vadd(home, vmul(randUnit(), ai.mode==='guard'?400:rnd(300,1600)));
      dir = vnorm(vsub(ai.wp,e.pos)); spd = C.spd*(ai.mode==='drift'?0.35:0.5);
      // patrol scans
      if (ai.mode==='patrol' && e.fac==='concord' && (SYSTEMS[S.sys].fac==='concord' || S.flags.checkpoint) && !S.flags.scanned && !P.dead && vdist(e.pos,P.pos)<900 && hasContraband()){
        S.flags.scanned = 1; openDialog(scanDialog(e));
      }
    }
  }
  turnToward(e, dir, C.turn*(t?AI_TURN:1)*dt);
  e.vel = vadd(vmul(e.vel, 1-Math.min(1,dt*1.1)), vmul(e.f, spd*Math.min(1,dt*1.1)));
  e.pos = vmad(e.pos, e.vel, dt);
}

        else { provoke(t); msg('"Not today, pirate!"','#e8c35a'); } }],

function pacify(t){

  for (const o of S.ents) if (o.kind==='ship' && (o===t || (g && o.grp===g)) && o.side==='hostile'){ o.side='neutral'; o.ai.mode='travel'; o.ai.dest=vadd(o.pos, vmul(vnorm(vsub(o.pos,P.pos)),5000)); }

// ---------- update ----------
function hostileNear(r){ return S.ents.some(e=>e.kind==='ship'&&e.side==='hostile'&&!e.dead&&!e.static&&vdist(e.pos,P.pos)<r); }
function spaceUpdate(dtReal){
  if (!S) return;
  let dt = Math.min(dtReal, 0.05);
  if (P.dead){ S.deadT -= dt; updateParticles(dt); if (S.deadT<=0 && !S.deadShown){ S.deadShown=true; showDeath(); } return; }
  const st = shipStats();
  // time compression
  S.ts = 1;
  if (S.auto){
    const dest = S.auto==='station' ? S.station : S.gate;
    if (!dest){ S.auto=null; }
    else {
      const d = vdist(P.pos,dest.pos);
      if (hostileNear(2600)){ S.auto=null; msg('Autopilot disengaged: hostiles nearby.','#ff6a5a'); sfx('alarm'); }
      else if (d<480){ S.auto=null; CTRL.thr=0.3; msg('Autopilot: arrived at '+dest.name+'.','#9fe8ff'); }
      else { S.ts = d>1500 ? 10 : 3; turnToward(P, vsub(dest.pos,P.pos), st.turn*2*dt); CTRL.thr = 1; }
    }
  }
  dt *= S.ts; S.t += dt;
  // player rotation
  if (!S.auto){
    const k = st.turn * dt * (S.hangT>0 ? 0.65 : 1);
    const ky = (KEYS.ArrowUp||KEYS.KeyW?1:0) - (KEYS.ArrowDown||KEYS.KeyS?1:0);
    const kx = (KEYS.ArrowRight||KEYS.KeyD?1:0) - (KEYS.ArrowLeft||KEYS.KeyA?1:0);
    const kr = (KEYS.KeyE?1:0) - (KEYS.KeyQ?1:0);
    let pitch = clamp(CTRL.pitch + ky*(SETTINGS.invert?-1:1), -1, 1), yaw = clamp(CTRL.yaw + kx, -1, 1), roll = clamp(CTRL.roll + kr, -1, 1);
    P.rp = (P.rp||0) + (pitch - (P.rp||0))*Math.min(1,dtReal*10);
    P.ry = (P.ry||0) + (yaw - (P.ry||0))*Math.min(1,dtReal*10);
    if (Math.abs(P.rp)>1e-3){ P.f=vrot(P.f,P.r,-P.rp*k); P.u=vrot(P.u,P.r,-P.rp*k); }
    if (Math.abs(P.ry)>1e-3){ P.f=vrot(P.f,P.u,P.ry*k); P.r=vrot(P.r,P.u,P.ry*k); }
    if (roll){ P.u=vrot(P.u,P.f,-roll*k*1.3); }
    reorth(P);
  }
  if (KEYS.KeyR) CTRL.thr = Math.min(1, CTRL.thr + dtReal*0.8);
  if (KEYS.KeyF) CTRL.thr = Math.max(0, CTRL.thr - dtReal*0.8);
  if (CTRL.thrUp) CTRL.thr = Math.min(1, CTRL.thr + dtReal*0.7);
  if (CTRL.thrDn) CTRL.thr = Math.max(0, CTRL.thr - dtReal*0.7);
  const boosting = (CTRL.boost||KEYS.ShiftLeft||KEYS.ShiftRight) && st.boost && P.energy>3;
  if (boosting) P.energy -= 32*dt; else P.energy = Math.min(100, P.energy + 14*dt);
  const tgtSpd = st.spd * CTRL.thr * (boosting?1.85:1);
  P.vel = vadd(vmul(P.vel, 1-Math.min(1,dt*1.6)), vmul(P.f, tgtSpd*Math.min(1,dt*1.6)));
  P.pos = vmad(P.pos, P.vel, dt);
  CTRL.fire = !!(CTRL.fireBtn || KEYS.Space);
  playerFire(dtReal);
  // regen
  P.sh = Math.min(P.maxSh, P.sh + st.regen*dt*(S.t - P.lastHit > 2.0 ? 1 : 0.4));
  if (st.nanite && !hostileNear(2500)) P.hp = Math.min(P.maxHp, P.hp + 0.9*dt);
  // collisions with big bodies
  for (const e of S.ents){
    if (e.dead || e===P) continue;
    if (e.kind==='station'||e.kind==='rock'||(e.kind==='ship'&&e.static)||e.kind==='gate'){
      const rr = e.kind==='gate' ? 0 : e.kind==='station' ? 120 : e.rad*0.85;
      if (!rr) continue;
      const d = vdist(P.pos,e.pos);
      if (d < rr+6){ const n=vnorm(vsub(P.pos,e.pos)); P.pos = vmad(e.pos,n,rr+7); const sp=vlen(P.vel); if (sp>40){ hurt(P, sp*0.06, 1, 1, false); } P.vel = vmul(n, Math.max(30,sp*0.3)); }
    }
  }
  // AI
  for (const e of S.ents){
    if (e.dead) continue;
    if (e.kind==='ship') aiUpdate(e, dt);
    else if (e.kind==='rock' && e.spin){ e.f=vrot(e.f,e.u,e.spin*dt*0.2); reorth(e); }
    else if (e.kind==='can'){ e.pos=vmad(e.pos,e.vel,dt); e.life-=dt; if (e.life<=0) e.dead=true; e.f=vrot(e.f,e.u,e.spin*dt); reorth(e);
      if (vdist(e.pos,P.pos)<70 && !(e.jett && S.jettCool>0)) collectCan(e); }
    else if (e.kind==='station'){ e.u=vrot(e.u,e.f,0.05*dt); reorth(e); }
    if (e.flash>0) e.flash-=dtReal;
  }
  if (P.flash>0) P.flash-=dtReal;
  // shots
  for (const s of S.shots){
    const p0 = s.p;
    if (s.msl){
      if (s.tgt && !s.tgt.dead){
        const spd = Math.min(s.friendly?400:290, vlen(s.v)+(s.friendly?220:150)*dt);

}
function sparks(p, rgb){ for (let i=0;i<5;i++) S.parts.push({p:p.slice(), v:vmul(randUnit(),rnd(20,70)), life:rnd(0.15,0.4), max:0.4, c:'rgb('+rgb.join(',')+')', s:1.4}); }

// ---------- player actions ----------
function cycleTarget(){
  const list = S.ents.filter(e=>(e.kind==='ship'||e.kind==='can'||(e.kind==='rock'&&vdist(e.pos,P.pos)<1500))&&!e.dead&&vdist(e.pos,P.pos)<6000);
  list.sort((a,b)=>{ const pa=a.side==='hostile'?0:a.kind==='ship'?1:2, pb=b.side==='hostile'?0:b.kind==='ship'?1:2; return pa-pb || vdist(a.pos,P.pos)-vdist(b.pos,P.pos); });

  const i = list.indexOf(S.target); S.target = list[(i+1)%list.length]; sfx('click');
}
function targetAhead(){
  let best=null, bd=0.9;
  for (const e of S.ents){ if (e.dead||!(e.kind==='ship'||e.kind==='can')) continue; const d=vdot(vnorm(vsub(e.pos,P.pos)),P.f); if (d>bd){bd=d;best=e;} }

}
function contextAction(){

}
function contextState(){
  if (!S || P.dead) return null;

}

  const nearGate = vdist(P.pos,S.gate.pos) < 900;

    body.appendChild(para('"Your name\'s on a list, pilot. Talon don\'t forget the ships you burn." A pause, and the crackle of someone chewing. "Lists get lost, though. Lists get lost all the time. ' + fmt(cost) + ' credits and I never saw your transponder."'));

// ===================== space rendering & HUD =====================
function camera(){

function toCam(cam, p){ const d=vsub(p,cam.pos); return [vdot(d,cam.r), vdot(d,cam.u), vdot(d,cam.f)]; }

    const g=ctx.createRadialGradient(x,y,0,x,y,R); g.addColorStop(0,rgbs(col,a)); g.addColorStop(0.5,rgbs(col,a*0.4)); g.addColorStop(1,rgbs(col,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill(); };

      for (const ep of e.mesh.eng){ const c = tf(ep); if (c[2]>2) glows.push({c, r:2.4*s*thr, col:e.side==='hostile'?[255,120,80]:e.fac==='vael'?[120,255,220]:[120,200,255]}); }
    }
    if (e.mesh===MESH.crystal){ const c=tf([0,0,0]); if (c[2]>2) glows.push({c, r:6*s, col:[120,255,220]}); }
    // nav light (side colour) so ships read against space
    if (isShip && e!==P && !e.static && z>5){
      const c = tf([0, 1.8, -1]); if (c[2]>2 && Math.sin(S.t*5+e.pos[0])>-0.3) lights.push({c, col:sideColor(e)});

    const [x,y] = proj(g.c); const R = Math.max(2.5, g.r*F/g.c[2]);

    const a = toCam(cam, s.p);
    if (s.msl){
      if (a[2]<3) continue; const [x,y]=proj(a); const r=Math.max(2.5, 3.5*F/a[2]);
      const gr=ctx.createRadialGradient(x,y,0,x,y,r*3); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.3,rgbs(s.rgb,0.8)); gr.addColorStop(1,rgbs(s.rgb,0));

    const pa=proj(seg[0]), pb=proj(seg[1]);
    const zz = Math.max(seg[0][2], 1.2);
    const wGlow = clamp(9*F/zz, 3, 14), wCore = clamp(2.6*F/zz, 1.4, 5);
    if (CM){ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle='#000'; ctx.lineWidth = wGlow*0.75+2; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke(); ctx.strokeStyle = rgbs(s.rgb); ctx.lineWidth = wGlow*0.75; ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke(); }

    ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke(); }

  }
  ctx.lineCap='butt';
  if (CM) ctx.globalCompositeOperation='lighter';

    const c = toCam(cam,p.p); if (c[2]<2) continue; const [x,y]=proj(c);
    const k = clamp(p.life/p.max,0,1);
    if (p.burst){ ctx.globalCompositeOperation='source-over'; const R=Math.max(10, p.s*F/c[2]*(0.6+(1-k)*0.9)); comicBurst(ctx,x,y,R,k,p.seed); if (p.word) comicWord(ctx,p.word,x,y-R*0.9-(1-k)*20,clamp(R*0.55,16,54),Math.min(1,k*2)); ctx.globalCompositeOperation='lighter'; continue; }

    }
  }
  ctx.globalCompositeOperation = 'source-over';
  if (S.ts>1){
    ctx.strokeStyle='rgba(180,220,255,0.25)'; ctx.lineWidth=1;
    for (let i=0;i<24;i++){ const a=rnd(Math.PI*2), r1=rnd(0.15,0.5)*Math.min(W,H), r2=r1*1.25; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2); ctx.stroke(); }

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of S.floats){ const c=toCam(cam,f.p); if (c[2]<3) continue; const [x,y]=proj(c);
    ctx.globalAlpha=clamp(f.life/0.5,0,1); ctx.font='bold 15px ui-monospace, Menlo, monospace'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.strokeText(f.t,x,y); ctx.fillStyle=f.c; ctx.fillText(f.t,x,y); }

}

function sideColor(e){
  if (!e) return '#fff';
  if (e.kind==='can') return '#f2eab8';
  if (e.kind==='rock') return '#c2b2a0';
  if (e.side==='hostile') return '#ff4f4f';
  if (e.side==='ally') return '#5dff8f';
  if (e.fac==='vael') return '#7ff0d8';
  return '#ffd25a';
}
function fmtDist(d){ return d>=1000 ? (d/1000).toFixed(1)+'k' : Math.round(d)+''; }
function panel(ctx,x,y,w,h){ ctx.fillStyle='rgba(4,14,24,0.62)'; ctx.strokeStyle='rgba(120,220,255,0.25)'; ctx.lineWidth=1; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x,y,w,h,8); else ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke(); }

function drawHUD(ctx, W, H, cam, F, cx, cy, proj){
  if (noirOn() && S){ // danger: heavy vignette, and the edges bleed red when the hull is failing
    ctx.drawImage(vignette(W, H), 0, 0, W, H); noirGrain(ctx, W, H);
    const hf = (typeof P !== 'undefined' && P && P.maxHp) ? P.hp / P.maxHp : 1;
    if (hf < 0.4){ const a = Math.min(0.75, (0.4 - hf) * 2.6) * (0.75 + 0.25 * Math.sin(performance.now() / 180)); const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.7); g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, 'rgba(170,0,0,' + a.toFixed(3) + ')'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  }
  const CM = comicOn();
  const small = Math.min(W,H) < 520;
  const fs = small ? 13 : 14;
  ctx.font = fs+'px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // crosshair (+ hit marker)
  if (S.view!=='chase'){
    const hit = S.hitT>0;
    ctx.strokeStyle = hit ? 'rgba(255,240,140,1)' : 'rgba(140,255,230,0.9)'; ctx.lineWidth = hit?2.5:2;
    ctx.beginPath(); ctx.arc(cx,cy,11,0,7); ctx.moveTo(cx-26,cy); ctx.lineTo(cx-15,cy); ctx.moveTo(cx+15,cy); ctx.lineTo(cx+26,cy); ctx.moveTo(cx,cy-26); ctx.lineTo(cx,cy-15); ctx.moveTo(cx,cy+15); ctx.lineTo(cx,cy+26); ctx.stroke();
    if (hit){ const k=8+S.hitT*40; ctx.beginPath(); ctx.moveTo(cx-k,cy-k); ctx.lineTo(cx-k/2,cy-k/2); ctx.moveTo(cx+k,cy-k); ctx.lineTo(cx+k/2,cy-k/2); ctx.moveTo(cx-k,cy+k); ctx.lineTo(cx-k/2,cy+k/2); ctx.moveTo(cx+k,cy+k); ctx.lineTo(cx+k/2,cy+k/2); ctx.stroke(); }
  } else { ctx.strokeStyle='rgba(140,255,230,0.7)'; ctx.lineWidth=2; const c=toCam(cam, vmad(P.pos,P.f,700)); if (c[2]>2){ const [x,y]=proj(c); ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.stroke(); } }
  // nav markers
  const marks = [];
  if (S.station) marks.push({p:S.station.pos, l:SYSTEMS[S.sys].derelict?'RELAY':'STATION', c:'#7fc8ff'});
  marks.push({p:S.gate.pos, l:'LANTERN', c: S.gate.dead_lantern&&!G.flags.laneOpen ? '#8a8d9a' : '#ffd27a'});
  if (S.beacon && !S.beacon.dead) marks.push({p:S.beacon.pos, l:'BEACON', c:'#ff6a8a', obj:1});
  if (S.heart && !S.heart.dead) marks.push({p:S.heart.pos, l:'HEART', c:'#7ff0d8', obj:1});
  if (S.field && !S.beacon) marks.push({p:S.field, l:'BELT', c:'#c2b2a0'});

        txt(ctx, m.l+' '+fmtDist(d), x, y+20, m.c); continue; } }

  }

    const d = vdist(P.pos,e.pos); if (d>3500) continue;
    const c = toCam(cam,e.pos), col = sideColor(e);
    if (c[2]>5){ const [x,y]=proj(c); const R=Math.max(10, e.rad*F/c[2]*1.0);
      if (x>-R&&x<W+R&&y>-R&&y<H+R){ ctx.strokeStyle=col; ctx.globalAlpha=0.75; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x-R,y-R+5); ctx.lineTo(x-R,y-R); ctx.lineTo(x-R+5,y-R); ctx.moveTo(x+R-5,y+R); ctx.lineTo(x+R,y+R); ctx.lineTo(x+R,y+R-5); ctx.stroke(); ctx.globalAlpha=1; continue; } }
    if (e.side==='hostile') edgeArrow(ctx,W,H,cx,cy,c,col,'',false,true);

      if (x>-R&&x<W+R&&y>-R&&y<H+R){

        ctx.moveTo(x+R-q,y-R); ctx.lineTo(x+R,y-R); ctx.lineTo(x+R,y-R+q);
        ctx.moveTo(x-R,y+R-q); ctx.lineTo(x-R,y+R); ctx.lineTo(x-R+q,y+R);
        ctx.moveTo(x+R-q,y+R); ctx.lineTo(x+R,y+R); ctx.lineTo(x+R,y+R-q); ctx.stroke();

          if (lp[2]>2){ const [lx,ly]=proj(lp); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(lx,ly,7,0,7); ctx.moveTo(lx-11,ly); ctx.lineTo(lx-4,ly); ctx.moveTo(lx+4,ly); ctx.lineTo(lx+11,ly); ctx.stroke();
            ctx.globalAlpha=0.35; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(lx,ly); ctx.stroke(); ctx.globalAlpha=1; }
        }

    }
    if (!onScreen) edgeArrow(ctx,W,H,cx,cy,c,col,fmtDist(d),true);
    // target info panel (bottom-left above roll buttons in landscape, top-left in portrait under bars)
    const pw = small?170:200, ph = 54;
    const px = 10, py = W<600 ? (shipStats().boost?118:104) : H - ph - 84;
    panel(ctx,px,py,pw,ph);
    ctx.textAlign='left'; ctx.font='bold '+(fs)+'px ui-monospace, Menlo, monospace'; ctx.fillStyle=col;
    let nm = t.name; while (ctx.measureText(nm).width > pw-16 && nm.length>4) nm = nm.slice(0,-2);
    ctx.fillText(nm, px+8, py+12);
    ctx.font=(fs-2)+'px ui-monospace, Menlo, monospace'; ctx.fillStyle='#a9c2d4';
    const sideL = t.kind==='ship' ? (t.side==='hostile'?'HOSTILE':t.side==='ally'?'ALLY':'NEUTRAL')+' · '+(FACTIONS[t.fac]?FACTIONS[t.fac].n:'') : t.kind==='can'?'CARGO':'ASTEROID';
    ctx.fillText(sideL+' · '+fmtDist(d), px+8, py+27);
    if (t.kind==='ship' && t.maxHp<9000){
      const bw = pw-16;
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(px+8,py+36,bw,12);
      if (t.maxSh){ ctx.fillStyle='#4fb4ff'; ctx.fillRect(px+8,py+36,bw*clamp(t.sh/t.maxSh,0,1),5); }
      ctx.fillStyle='#ff9a4a'; ctx.fillRect(px+8,py+43,bw*clamp(t.hp/t.maxHp,0,1),5);
    } else if (t.kind==='rock'){ ctx.fillStyle='#c2b2a0'; ctx.fillRect(px+8,py+40,(pw-16)*clamp(t.hp/t.maxHp,0,1),5); }
    ctx.textAlign='center';
  }
  // radar
  const rr = small?46:58, ry = rr+10, rx = Math.max(W/2, 4+(small?100:130)+86+10+rr);
  ctx.fillStyle='rgba(4,16,26,0.65)'; ctx.strokeStyle='rgba(120,220,255,0.55)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(rx,ry,rr,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(rx,ry,rr*0.5,0,7); ctx.moveTo(rx-rr,ry); ctx.lineTo(rx+rr,ry); ctx.moveTo(rx,ry-rr); ctx.lineTo(rx,ry+rr); ctx.strokeStyle='rgba(120,220,255,0.15)'; ctx.stroke();
  ctx.fillStyle='rgba(120,220,255,0.6)'; ctx.beginPath(); ctx.moveTo(rx,ry-5); ctx.lineTo(rx+4,ry+4); ctx.lineTo(rx-4,ry+4); ctx.closePath(); ctx.fill();
  const RR = 3000;

    ctx.fillStyle='#e6f6ff'; ctx.textAlign='left'; ctx.font=(fs-1)+'px ui-monospace, Menlo, monospace'; ctx.fillText(lab+' '+Math.ceil(Math.max(0,v)), bx+bw+6, y+6); };
  bar(by, P.sh, P.maxSh, '#4fb4ff', 'SHD');
  bar(by+16, P.hp, P.maxHp, P.hp<P.maxHp*0.3?'#ff4a4a':'#ff9a4a', 'HUL');
  let yy = by+32;
  if (st.boost){ bar(yy, P.energy, 100, '#ffe46a', 'BST'); yy+=16; }
  // throttle gauge
